[package]
name = "monitor_core"
version.workspace = true
authors.workspace = true
description = "XGView core: camera model, configuration, grid/page scheduler, discovery and RTSP state machine"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
crossbeam-channel = "0.5"
futures = "0.3"
getrandom = "0.2"
md-5 = "0.10"
pbkdf2 = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

monitor_codec = { path = "../monitor_codec" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Memory and processor load, for the About page; see `vitals`. The same crate
# version the interface already uses, so nothing new is linked.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }

# `localtime_r` for the blackout schedule's local clock. Already in the tree
# through the async runtime, so naming it costs nothing new.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The desktop's own way of being asked to leave the screen alone: X11 DPMS is
# not driven by logind, so `systemd-inhibit --what=idle` cannot reach it (see
# `power`). Held as a live session-bus connection, so a pure Rust client rather
# than a C library the package would have to carry.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"
