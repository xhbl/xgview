[package]
name = "monitor_android"
version.workspace = true
authors.workspace = true
description = "XGView Android entry point: NativeActivity bootstrap and boot-completed auto start"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[lib]
name = "monitor_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
eframe = { version = "0.32", features = ["wgpu", "android-native-activity"] }
jni = "0.21"

monitor_core = { path = "../monitor_core" }
monitor_gui = { path = "../monitor_gui" }
