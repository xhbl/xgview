[package]
name = "monitor_gui"
version.workspace = true
authors.workspace = true
description = "XGView desktop/TV GUI: egui + wgpu grid viewer with pagination and DPAD focus navigation"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
egui = "0.32"
eframe = { version = "0.32", features = ["wgpu"] }
# The decoded planes are uploaded as textures and turned into colour by a WGSL
# shader, which needs the renderer eframe already runs and its wgpu.
egui-wgpu = "0.32"
wgpu = "25"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

monitor_core = { path = "../monitor_core" }
monitor_codec = { path = "../monitor_codec" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
